# Runs the tests on every push and pull request.
# The embedding model is cached between runs so semantic-search tests run too.
# Voice tests skip here (they need macOS `say` and the Whisper model).
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python files compile
        run: python -m compileall -q app tests desktop.py

      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: data/models
          key: models-bge-small-en-v1.5

      - name: Download the embedding model (first run only)
        run: python -c "from app import memory; memory.Embedder().embed_query('warm up')"

      - name: Tests
        run: python -m pytest -q
