# Makes a GitHub release with a ready-to-download zip whenever the number in
# VERSION goes up. Release titles look like "Personal AI OS v0.6.0".
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml, .github/RELEASE_NOTES.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: v
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p dist
            git archive --format=zip --prefix=personal-ai-os/ -o "dist/personal-ai-os-$TAG.zip" HEAD -- . ':!.github'
            gh release create "$TAG" "dist/personal-ai-os-$TAG.zip" \
              --target "$GITHUB_SHA" --title "Personal AI OS $TAG" --notes-file .github/RELEASE_NOTES.md --generate-notes
          else
            # notes were updated for the current version
            gh release edit "$TAG" --notes-file .github/RELEASE_NOTES.md
          fi
          # keep every release title as "Personal AI OS <version>"
          gh release list --limit 100 --json tagName,name \
            -q '.[] | select(.name != ("Personal AI OS " + .tagName)) | .tagName' |
            while read -r t; do gh release edit "$t" --title "Personal AI OS $t"; done
